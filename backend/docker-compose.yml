  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coderunner-data:/app/data
      - /tmp:/tmp
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/coderunner.db
    restart: unless-stopped