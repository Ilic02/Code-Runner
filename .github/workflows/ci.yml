name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build runner images
        working-directory: .
        run: docker build -t coderunner/cpp runners/cpp && docker build -t coderunner/c runners/c && docker build -t coderunner/java runners/java && docker build -t coderunner/python runners/python && docker build -t coderunner/js runners/js
      - run: chmod +x gradlew && ./gradlew build
      - name: Show test failures
        if: always()
        working-directory: backend
        run: |
          for f in build/test-results/test/*.xml; do
            echo "=== $f ==="
            cat "$f"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

  escape-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build runner images
        run: docker build -t coderunner/cpp runners/cpp && docker build -t coderunner/c runners/c && docker build -t coderunner/java runners/java && docker build -t coderunner/python runners/python && docker build -t coderunner/js runners/js
      - name: Run escape tests
        working-directory: backend
        run: chmod +x gradlew && ./gradlew test --tests "*.EscapeTest"